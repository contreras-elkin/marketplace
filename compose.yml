services:
  postgres:
    image: postgres:17-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  liquibase:
    image: liquibase/liquibase:4.31.1
    container_name: marketplace_migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-marketplace}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-marketplace}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
    volumes:
      - ./migrations:/liquibase/changelog:ro
    command: update
    restart: "no"

  api:
    build: ./api
    container_name: marketplace-api
    restart: unless-stopped
    depends_on:
      liquibase:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # Dentro de la red de Docker la base de datos se llama por el nombre del servicio
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  postgres_data:
