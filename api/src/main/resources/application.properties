spring.application.name=market

# Variables desde el .env de la raíz (corriendo con ./mvnw desde api/).
# Es opcional: en un contenedor llegan como variables de entorno reales.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:marketplace}
spring.datasource.username=${POSTGRES_USER:marketplace}
spring.datasource.password=${POSTGRES_PASSWORD:marketplace}

# El esquema lo maneja Liquibase; Hibernate solo verifica que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

wompi.api-key=${WOMPI_PUBLIC_KEY}
wompi.integri-key=${WOMPI_INTEGRITY_SECRET}
wompi.events-key=${WOMPI_EVENTS_SECRET}
